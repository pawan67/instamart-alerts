[project]
name = "instamart-alerts"
version = "0.1.0"
description = "Telegram price-drop alerts for Swiggy Instamart"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx[socks]>=0.28.1",
    "playwright>=1.62.0",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
im = "instamart_alerts.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["instamart_alerts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
